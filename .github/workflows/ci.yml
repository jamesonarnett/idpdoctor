name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      # docs/TAXONOMY.md must match codes.go; fail if go generate would change it.
      - run: go generate ./... && git diff --exit-code -- docs/TAXONOMY.md
